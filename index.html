<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Endless 3D Highway Racer</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Arial Black', 'Impact', sans-serif;
            background: #000;
            touch-action: none;
            user-select: none;
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            text-shadow: 0 0 10px #00aaff, 0 0 20px #0088ff;
            z-index: 10;
            pointer-events: none;
            font-size: 24px;
            letter-spacing: 2px;
        }
        #hud .score {
            font-size: 36px;
            color: #ffdd44;
            text-shadow: 0 0 20px #ffaa00;
        }
        #hud .shield {
            color: #44ddff;
            font-size: 28px;
            margin-top: 10px;
        }
        #hud .speed {
            color: #ff8844;
            font-size: 24px;
            margin-top: 5px;
        }
        #game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.85);
            border: 3px solid #ff4444;
            border-radius: 20px;
            padding: 40px 60px;
            text-align: center;
            color: #fff;
            z-index: 20;
            box-shadow: 0 0 50px #ff0000;
            display: none;
            pointer-events: auto;
            backdrop-filter: blur(5px);
        }
        #game-over h1 {
            font-size: 60px;
            color: #ff4444;
            text-shadow: 0 0 30px #ff0000;
            margin: 0 0 20px;
        }
        #game-over p {
            font-size: 28px;
            color: #ffaa00;
            margin: 10px 0;
        }
        #game-over .final-score {
            font-size: 48px;
            color: #ffdd44;
            text-shadow: 0 0 20px #ffaa00;
        }
        #game-over button {
            margin-top: 30px;
            padding: 15px 50px;
            font-size: 28px;
            font-family: 'Arial Black', 'Impact', sans-serif;
            background: #ff4444;
            color: #fff;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 30px #ff4444;
            transition: all 0.2s;
            letter-spacing: 2px;
        }
        #game-over button:hover {
            background: #ff6666;
            box-shadow: 0 0 50px #ff6666;
            transform: scale(1.05);
        }
        #pause-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.8);
            border: 3px solid #00aaff;
            border-radius: 20px;
            padding: 40px 80px;
            text-align: center;
            color: #fff;
            z-index: 20;
            box-shadow: 0 0 50px #00aaff;
            display: none;
            pointer-events: none;
        }
        #pause-overlay h2 {
            font-size: 50px;
            color: #00aaff;
            text-shadow: 0 0 30px #00aaff;
            margin: 0;
        }
        #pause-overlay p {
            font-size: 24px;
            color: #888;
            margin-top: 20px;
        }
        /* Touch controls */
        #touch-controls {
            position: absolute;
            bottom: 30px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            padding: 0 30px;
            z-index: 15;
            pointer-events: none;
        }
        #touch-controls .left-group,
        #touch-controls .right-group {
            display: flex;
            gap: 15px;
            pointer-events: auto;
        }
        #touch-controls .btn {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            border: 3px solid rgba(255, 255, 255, 0.5);
            color: #fff;
            font-size: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(5px);
            touch-action: none;
            cursor: pointer;
            user-select: none;
            transition: all 0.1s;
            box-shadow: 0 0 20px rgba(0, 150, 255, 0.3);
        }
        #touch-controls .btn:active {
            background: rgba(255, 255, 255, 0.4);
            transform: scale(0.95);
        }
        #touch-controls .btn.fire {
            background: rgba(255, 50, 50, 0.3);
            border-color: #ff4444;
            box-shadow: 0 0 30px #ff4444;
            font-size: 36px;
        }
        #touch-controls .btn.fire:active {
            background: rgba(255, 50, 50, 0.7);
        }
        #touch-controls .btn.accelerate {
            background: rgba(50, 255, 100, 0.2);
            border-color: #44ff88;
            box-shadow: 0 0 30px #44ff88;
            font-size: 36px;
        }
        #touch-controls .btn.accelerate:active {
            background: rgba(50, 255, 100, 0.6);
        }
        .hidden {
            display: none !important;
        }
        @media (max-width: 768px) {
            #hud { font-size: 18px; }
            #hud .score { font-size: 28px; }
            #hud .shield { font-size: 22px; }
            #hud .speed { font-size: 18px; }
            #game-over h1 { font-size: 40px; }
            #game-over .final-score { font-size: 36px; }
            #game-over { padding: 30px 40px; }
            #touch-controls .btn { width: 65px; height: 65px; font-size: 32px; }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        <div id="hud">
            <div>SCORE <span class="score" id="scoreDisplay">0</span></div>
            <div class="shield" id="shieldDisplay">🛡️ SHIELD: 0</div>
            <div class="speed" id="speedDisplay">SPEED: 0</div>
        </div>
        <div id="game-over">
            <h1>CRASHED!</h1>
            <p>Final Score</p>
            <div class="final-score" id="finalScore">0</div>
            <button id="restartBtn">RACE AGAIN</button>
        </div>
        <div id="pause-overlay">
            <h2>⏸ PAUSED</h2>
            <p>Press ESC to resume</p>
        </div>
        <!-- Touch Controls -->
        <div id="touch-controls">
            <div class="left-group">
                <div class="btn" id="btnLeft">◀</div>
                <div class="btn" id="btnRight">▶</div>
            </div>
            <div class="right-group">
                <div class="btn fire" id="btnFire">🔥</div>
                <div class="btn accelerate" id="btnAccel">▲</div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        (function() {
            // ----- GAME STATE -----
            let gameActive = true;
            let gameOver = false;
            let paused = false;
            
            let score = 0;
            let shieldCount = 0;
            let gameSpeed = 0.8;          // base speed multiplier
            let playerSpeed = 0;           // actual speed value for display
            const MAX_SPEED = 2.5;
            const MIN_SPEED = 0.5;
            const ACCELERATION = 0.008;
            const DECELERATION = 0.005;
            
            // Player state
            let playerX = 0;
            const PLAYER_LANE_WIDTH = 2.2;
            const MAX_PLAYER_X = 4.0;
            const STEER_SPEED = 0.12;
            
            // Coins & obstacles & powerups
            let coins = [];
            let obstacles = [];
            let shields = [];
            
            // Spawn timers
            let spawnTimer = 0;
            let coinSpawnTimer = 0;
            let shieldSpawnTimer = 0;
            
            // Three.js globals
            let scene, camera, renderer;
            let playerCar;
            let roadSegments = [];
            const SEGMENT_LENGTH = 30;
            const NUM_SEGMENTS = 10;
            const ROAD_WIDTH = 12;
            
            // Bullets
            let bullets = [];
            
            // Input state
            const keys = {
                ArrowLeft: false,
                ArrowRight: false,
                KeyA: false,
                KeyD: false,
                ArrowUp: false,
                KeyW: false,
                Space: false,
                Escape: false
            };
            
            // Touch input flags
            let touchLeft = false;
            let touchRight = false;
            let touchAccel = false;
            let touchFire = false;
            
            // For firing cooldown
            let fireCooldown = 0;
            const FIRE_RATE = 12; // frames between shots
            
            // DOM elements
            const scoreDisplay = document.getElementById('scoreDisplay');
            const shieldDisplay = document.getElementById('shieldDisplay');
            const speedDisplay = document.getElementById('speedDisplay');
            const gameOverDiv = document.getElementById('game-over');
            const finalScoreSpan = document.getElementById('finalScore');
            const pauseOverlay = document.getElementById('pause-overlay');
            const restartBtn = document.getElementById('restartBtn');
            const btnLeft = document.getElementById('btnLeft');
            const btnRight = document.getElementById('btnRight');
            const btnFire = document.getElementById('btnFire');
            const btnAccel = document.getElementById('btnAccel');
            
            // ----- THREE.JS INIT -----
            function initThree() {
                scene = new THREE.Scene();
                scene.background = new THREE.Color(0x0a0a2a);
                scene.fog = new THREE.Fog(0x0a0a2a, 30, 120);
                
                camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);
                camera.position.set(0, 5, 10);
                camera.lookAt(0, 2, -20);
                
                renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('gameCanvas'), antialias: true });
                renderer.setSize(window.innerWidth, window.innerHeight);
                renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                renderer.shadowMap.enabled = true;
                renderer.shadowMap.type = THREE.PCFSoftShadowMap;
                
                // Lights
                const ambientLight = new THREE.AmbientLight(0x404060);
                scene.add(ambientLight);
                
                const dirLight = new THREE.DirectionalLight(0xffffff, 1);
                dirLight.position.set(10, 20, 10);
                dirLight.castShadow = true;
                dirLight.shadow.mapSize.width = 1024;
                dirLight.shadow.mapSize.height = 1024;
                const d = 30;
                dirLight.shadow.camera.left = -d;
                dirLight.shadow.camera.right = d;
                dirLight.shadow.camera.top = d;
                dirLight.shadow.camera.bottom = -d;
                dirLight.shadow.camera.near = 1;
                dirLight.shadow.camera.far = 50;
                scene.add(dirLight);
                
                // Add stars / environment
                addStars();
                
                // Create player car
                createPlayerCar();
                
                // Create road segments
                createRoad();
                
                // Add some initial coins and obstacles
                resetGame();
            }
            
            function addStars() {
                const starsGeometry = new THREE.BufferGeometry();
                const starsCount = 2000;
                const positions = new Float32Array(starsCount * 3);
                for (let i = 0; i < starsCount * 3; i += 3) {
                    positions[i] = (Math.random() - 0.5) * 500;
                    positions[i+1] = Math.random() * 200 + 10;
                    positions[i+2] = (Math.random() - 0.5) * 500 - 100;
                }
                starsGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                const starsMaterial = new THREE.PointsMaterial({ color: 0xffffff, size: 0.5 });
                const stars = new THREE.Points(starsGeometry, starsMaterial);
                scene.add(stars);
            }
            
            function createPlayerCar() {
                const carGroup = new THREE.Group();
                
                // Car body
                const bodyGeo = new THREE.BoxGeometry(1.8, 0.8, 3.5);
                const bodyMat = new THREE.MeshStandardMaterial({ color: 0xff3333, emissive: 0x330000, roughness: 0.4, metalness: 0.6 });
                const body = new THREE.Mesh(bodyGeo, bodyMat);
                body.castShadow = true;
                body.receiveShadow = true;
                body.position.y = 0.6;
                carGroup.add(body);
                
                // Cabin
                const cabinGeo = new THREE.BoxGeometry(1.3, 0.6, 1.6);
                const cabinMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.2, metalness: 0.8 });
                const cabin = new THREE.Mesh(cabinGeo, cabinMat);
                cabin.castShadow = true;
                cabin.receiveShadow = true;
                cabin.position.set(0, 1.2, -0.2);
                carGroup.add(cabin);
                
                // Wheels
                const wheelGeo = new THREE.CylinderGeometry(0.45, 0.45, 0.4, 16);
                const wheelMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.8 });
                const positions = [
                    [-0.9, 0.35, 1.2], [0.9, 0.35, 1.2],
                    [-0.9, 0.35, -1.2], [0.9, 0.35, -1.2]
                ];
                positions.forEach(pos => {
                    const wheel = new THREE.Mesh(wheelGeo, wheelMat);
                    wheel.rotation.z = Math.PI / 2;
                    wheel.position.set(pos[0], pos[1], pos[2]);
                    wheel.castShadow = true;
                    wheel.receiveShadow = true;
                    carGroup.add(wheel);
                });
                
                // Headlights (glow)
                const lightGeo = new THREE.SphereGeometry(0.25);
                const lightMat = new THREE.MeshStandardMaterial({ color: 0xffffaa, emissive: 0xffff00 });
                const leftLight = new THREE.Mesh(lightGeo, lightMat);
                leftLight.position.set(-0.6, 0.6, -1.8);
                carGroup.add(leftLight);
                const rightLight = new THREE.Mesh(lightGeo, lightMat);
                rightLight.position.set(0.6, 0.6, -1.8);
                carGroup.add(rightLight);
                
                carGroup.position.set(0, 0.2, 0);
                playerCar = carGroup;
                scene.add(playerCar);
            }
            
            function createRoad() {
                // Remove old segments
                roadSegments.forEach(seg => scene.remove(seg));
                roadSegments = [];
                
                // Create road segments
                for (let i = 0; i < NUM_SEGMENTS; i++) {
                    const seg = createRoadSegment();
                    seg.position.z = -i * SEGMENT_LENGTH + 20;
                    scene.add(seg);
                    roadSegments.push(seg);
                }
            }
            
            function createRoadSegment() {
                const segGroup = new THREE.Group();
                
                // Road surface
                const roadGeo = new THREE.PlaneGeometry(ROAD_WIDTH, SEGMENT_LENGTH);
                const roadMat = new THREE.MeshStandardMaterial({ color: 0x333344, roughness: 0.9, metalness: 0.1 });
                const road = new THREE.Mesh(roadGeo, roadMat);
                road.rotation.x = -Math.PI / 2;
                road.position.y = 0;
                road.receiveShadow = true;
                segGroup.add(road);
                
                // Road lines (center and sides)
                const lineMat = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0x444444 });
                const lineGeo = new THREE.BoxGeometry(0.2, 0.05, 2);
                const lineSpacing = 4;
                for (let z = -SEGMENT_LENGTH/2 + 1; z < SEGMENT_LENGTH/2; z += lineSpacing) {
                    const line = new THREE.Mesh(lineGeo, lineMat);
                    line.position.set(0, 0.05, z);
                    line.receiveShadow = false;
                    segGroup.add(line);
                }
                
                // Side barriers
                const barrierMat = new THREE.MeshStandardMaterial({ color: 0x888899, emissive: 0x222233 });
                const barrierGeo = new THREE.BoxGeometry(0.5, 1.0, SEGMENT_LENGTH);
                const leftBarrier = new THREE.Mesh(barrierGeo, barrierMat);
                leftBarrier.position.set(-ROAD_WIDTH/2 - 0.25, 0.5, 0);
                leftBarrier.castShadow = true;
                leftBarrier.receiveShadow = true;
                segGroup.add(leftBarrier);
                
                const rightBarrier = new THREE.Mesh(barrierGeo, barrierMat);
                rightBarrier.position.set(ROAD_WIDTH/2 + 0.25, 0.5, 0);
                rightBarrier.castShadow = true;
                rightBarrier.receiveShadow = true;
                segGroup.add(rightBarrier);
                
                // Side grass
                const grassMat = new THREE.MeshStandardMaterial({ color: 0x1a3a1a, roughness: 1 });
                const grassGeo = new THREE.PlaneGeometry(10, SEGMENT_LENGTH);
                const leftGrass = new THREE.Mesh(grassGeo, grassMat);
                leftGrass.rotation.x = -Math.PI / 2;
                leftGrass.position.set(-ROAD_WIDTH/2 - 5.5, -0.05, 0);
                leftGrass.receiveShadow = true;
                segGroup.add(leftGrass);
                
                const rightGrass = new THREE.Mesh(grassGeo, grassMat);
                rightGrass.rotation.x = -Math.PI / 2;
                rightGrass.position.set(ROAD_WIDTH/2 + 5.5, -0.05, 0);
                rightGrass.receiveShadow = true;
                segGroup.add(rightGrass);
                
                return segGroup;
            }
            
            // ----- SPAWNING -----
            function spawnObstacle() {
                const lane = Math.floor(Math.random() * 3) - 1; // -1, 0, 1
                const xPos = lane * (ROAD_WIDTH / 3);
                
                const group = new THREE.Group();
                
                // Different obstacle types
                const type = Math.random();
                let color, width, height, depth;
                if (type < 0.6) {
                    // Car-like obstacle
                    color = 0x3366ff;
                    width = 1.8;
                    height = 0.8;
                    depth = 3.5;
                } else if (type < 0.85) {
                    // Truck
                    color = 0xffaa00;
                    width = 2.0;
                    height = 1.4;
                    depth = 5.0;
                } else {
                    // Barrier / cone
                    color = 0xff4400;
                    width = 1.0;
                    height = 1.2;
                    depth = 1.0;
                }
                
                const bodyGeo = new THREE.BoxGeometry(width, height, depth);
                const bodyMat = new THREE.MeshStandardMaterial({ color: color, emissive: color === 0x3366ff ? 0x001133 : 0x331100, roughness: 0.5 });
                const body = new THREE.Mesh(bodyGeo, bodyMat);
                body.position.y = height / 2;
                body.castShadow = true;
                body.receiveShadow = true;
                group.add(body);
                
                // Add some detail
                if (color === 0x3366ff) {
                    // Car cabin
                    const cabinGeo = new THREE.BoxGeometry(1.3, 0.5, 1.5);
                    const cabinMat = new THREE.MeshStandardMaterial({ color: 0x222222 });
                    const cabin = new THREE.Mesh(cabinGeo, cabinMat);
                    cabin.position.set(0, height + 0.25, -0.2);
                    cabin.castShadow = true;
                    cabin.receiveShadow = true;
                    group.add(cabin);
                }
                
                group.position.set(xPos, 0, -80 - Math.random() * 20);
                scene.add(group);
                
                obstacles.push({
                    mesh: group,
                    x: xPos,
                    z: group.position.z,
                    width: width,
                    height: height,
                    depth: depth,
                    type: 'obstacle'
                });
            }
            
            function spawnCoin() {
                const lane = Math.floor(Math.random() * 3) - 1;
                const xPos = lane * (ROAD_WIDTH / 3);
                
                const coinGroup = new THREE.Group();
                const coinGeo = new THREE.TorusGeometry(0.4, 0.15, 8, 16);
                const coinMat = new THREE.MeshStandardMaterial({ color: 0xffdd00, emissive: 0x553300, roughness: 0.3, metalness: 0.8 });
                const coin = new THREE.Mesh(coinGeo, coinMat);
                coin.rotation.x = Math.PI / 2;
                coin.position.y = 1.2;
                coin.castShadow = true;
                coinGroup.add(coin);
                
                // Inner glow
                const innerGeo = new THREE.CylinderGeometry(0.2, 0.2, 0.1, 8);
                const innerMat = new THREE.MeshStandardMaterial({ color: 0xffaa00, emissive: 0xff8800 });
                const inner = new THREE.Mesh(innerGeo, innerMat);
                inner.rotation.x = Math.PI / 2;
                inner.position.y = 1.2;
                coinGroup.add(inner);
                
                coinGroup.position.set(xPos, 0, -80 - Math.random() * 20);
                scene.add(coinGroup);
                
                coins.push({
                    mesh: coinGroup,
                    x: xPos,
                    z: coinGroup.position.z,
                    width: 0.8,
                    height: 1.8,
                    depth: 0.8,
                    type: 'coin',
                    collected: false
                });
            }
            
            function spawnShield() {
                const lane = Math.floor(Math.random() * 3) - 1;
                const xPos = lane * (ROAD_WIDTH / 3);
                
                const shieldGroup = new THREE.Group();
                const shieldGeo = new THREE.OctahedronGeometry(0.6);
                const shieldMat = new THREE.MeshStandardMaterial({ color: 0x44ddff, emissive: 0x0066aa, roughness: 0.2, metalness: 0.9 });
                const shieldMesh = new THREE.Mesh(shieldGeo, shieldMat);
                shieldMesh.position.y = 1.5;
                shieldMesh.castShadow = true;
                shieldGroup.add(shieldMesh);
                
                // Add a glow ring
                const ringGeo = new THREE.TorusGeometry(0.9, 0.08, 8, 24);
                const ringMat = new THREE.MeshStandardMaterial({ color: 0x88eeff, emissive: 0x0088cc });
                const ring = new THREE.Mesh(ringGeo, ringMat);
                ring.rotation.x = Math.PI / 2;
                ring.position.y = 1.5;
                shieldGroup.add(ring);
                
                shieldGroup.position.set(xPos, 0, -80 - Math.random() * 20);
                scene.add(shieldGroup);
                
                shields.push({
                    mesh: shieldGroup,
                    x: xPos,
                    z: shieldGroup.position.z,
                    width: 1.2,
                    height: 2.0,
                    depth: 1.2,
                    type: 'shield',
                    collected: false
                });
            }
            
            // ----- RESET / START -----
            function resetGame() {
                // Remove all existing objects
                obstacles.forEach(o => scene.remove(o.mesh));
                coins.forEach(c => scene.remove(c.mesh));
                shields.forEach(s => scene.remove(s.mesh));
                bullets.forEach(b => scene.remove(b.mesh));
                
                obstacles = [];
                coins = [];
                shields = [];
                bullets = [];
                
                // Reset state
                score = 0;
                shieldCount = 0;
                gameSpeed = 0.8;
                playerSpeed = 0;
                playerX = 0;
                gameActive = true;
                gameOver = false;
                paused = false;
                fireCooldown = 0;
                
                // Reset player position
                playerCar.position.x = 0;
                playerCar.position.y = 0.2;
                
                // Reset UI
                gameOverDiv.style.display = 'none';
                pauseOverlay.style.display = 'none';
                updateHUD();
                
                // Spawn initial items
                for (let i = 0; i < 5; i++) {
                    spawnObstacle();
                }
                for (let i = 0; i < 3; i++) {
                    spawnCoin();
                }
                for (let i = 0; i < 2; i++) {
                    spawnShield();
                }
                
                // Reset spawn timers
                spawnTimer = 0;
                coinSpawnTimer = 0;
                shieldSpawnTimer = 0;
            }
            
            // ----- COLLISION DETECTION -----
            function checkCollisions() {
                const playerBox = {
                    x: playerCar.position.x,
                    z: playerCar.position.z,
                    width: 1.8,
                    height: 1.6,
                    depth: 3.5
                };
                
                // Check obstacles
                for (let i = obstacles.length - 1; i >= 0; i--) {
                    const obs = obstacles[i];
                    if (Math.abs(obs.x - playerBox.x) < (obs.width + playerBox.width) / 2 &&
                        Math.abs(obs.z - playerBox.z) < (obs.depth + playerBox.depth) / 2) {
                        
                        // Collision!
                        if (shieldCount > 0) {
                            // Destroy obstacle, use shield
                            shieldCount--;
                            scene.remove(obs.mesh);
                            obstacles.splice(i, 1);
                            // Visual feedback - small explosion
                            createExplosion(obs.x, 1, obs.z);
                            updateHUD();
                        } else {
                            // Game over
                            endGame();
                            return;
                        }
                    }
                }
                
                // Check coins
                for (let i = coins.length - 1; i >= 0; i--) {
                    const coin = coins[i];
                    if (!coin.collected && 
                        Math.abs(coin.x - playerBox.x) < (coin.width + playerBox.width) / 2 + 0.3 &&
                        Math.abs(coin.z - playerBox.z) < (coin.depth + playerBox.depth) / 2 + 0.5) {
                        
                        coin.collected = true;
                        score += 10;
                        scene.remove(coin.mesh);
                        coins.splice(i, 1);
                        updateHUD();
                    }
                }
                
                // Check shields
                for (let i = shields.length - 1; i >= 0; i--) {
                    const shield = shields[i];
                    if (!shield.collected && 
                        Math.abs(shield.x - playerBox.x) < (shield.width + playerBox.width) / 2 + 0.3 &&
                        Math.abs(shield.z - playerBox.z) < (shield.depth + playerBox.depth) / 2 + 0.5) {
                        
                        shield.collected = true;
                        shieldCount = Math.min(shieldCount + 1, 3); // max 3 shields
                        scene.remove(shield.mesh);
                        shields.splice(i, 1);
                        updateHUD();
                    }
                }
                
                // Check bullets vs obstacles
                for (let b = bullets.length - 1; b >= 0; b--) {
                    const bullet = bullets[b];
                    for (let o = obstacles.length - 1; o >= 0; o--) {
                        const obs = obstacles[o];
                        if (Math.abs(bullet.x - obs.x) < (obs.width) / 2 + 0.3 &&
                            Math.abs(bullet.z - obs.z) < (obs.depth) / 2 + 0.5) {
                            
                            // Destroy obstacle
                            scene.remove(obs.mesh);
                            obstacles.splice(o, 1);
                            // Remove bullet
                            scene.remove(bullet.mesh);
                            bullets.splice(b, 1);
                            // Add score
                            score += 5;
                            createExplosion(obs.x, 1, obs.z);
                            updateHUD();
                            break;
                        }
                    }
                }
            }
            
            function createExplosion(x, y, z) {
                // Simple particle effect
                const particles = new THREE.Group();
                for (let i = 0; i < 8; i++) {
                    const geo = new THREE.SphereGeometry(0.15);
                    const mat = new THREE.MeshStandardMaterial({ color: 0xffaa00, emissive: 0xff4400 });
                    const p = new THREE.Mesh(geo, mat);
                    p.position.set(x + (Math.random() - 0.5) * 2, y + Math.random() * 2, z + (Math.random() - 0.5) * 2);
                    p.userData.velocity = new THREE.Vector3((Math.random() - 0.5) * 0.2, Math.random() * 0.2, (Math.random() - 0.5) * 0.2);
                    p.userData.life = 20;
                    particles.add(p);
                }
                particles.userData.isExplosion = true;
                particles.userData.life = 20;
                scene.add(particles);
                // Store explosions separately or handle in animate loop
                if (!window.explosions) window.explosions = [];
                window.explosions.push(particles);
            }
            
            // ----- GAME ACTIONS -----
            function fireBullet() {
                if (fireCooldown > 0) return;
                
                // Create bullet
                const bulletGeo = new THREE.SphereGeometry(0.25, 8, 8);
                const bulletMat = new THREE.MeshStandardMaterial({ color: 0xff8800, emissive: 0xff4400 });
                const bulletMesh = new THREE.Mesh(bulletGeo, bulletMat);
                bulletMesh.position.set(playerCar.position.x, 1.5, playerCar.position.z - 2.5);
                bulletMesh.castShadow = true;
                scene.add(bulletMesh);
                
                bullets.push({
                    mesh: bulletMesh,
                    x: playerCar.position.x,
                    z: playerCar.position.z - 2.5,
                    speed: 1.8
                });
                
                fireCooldown = FIRE_RATE;
            }
            
            function endGame() {
                gameActive = false;
                gameOver = true;
                finalScoreSpan.textContent = score;
                gameOverDiv.style.display = 'block';
            }
            
            function updateHUD() {
                scoreDisplay.textContent = score;
                shieldDisplay.textContent = `🛡️ SHIELD: ${shieldCount}`;
                speedDisplay.textContent = `SPEED: ${Math.round(gameSpeed * 100)}`;
            }
            
            // ----- UPDATE -----
            function updateGame() {
                if (!gameActive || paused) return;
                
                // Update fire cooldown
                if (fireCooldown > 0) fireCooldown--;
                
                // Player steering
                const steerLeft = keys.ArrowLeft || keys.KeyA || touchLeft;
                const steerRight = keys.ArrowRight || keys.KeyD || touchRight;
                
                if (steerLeft) {
                    playerX -= STEER_SPEED;
                }
                if (steerRight) {
                    playerX += STEER_SPEED;
                }
                
                // Clamp player position
                playerX = Math.max(-MAX_PLAYER_X, Math.min(MAX_PLAYER_X, playerX));
                playerCar.position.x = playerX;
                
                // Player acceleration
                const accel = keys.ArrowUp || keys.KeyW || touchAccel;
                if (accel) {
                    gameSpeed = Math.min(MAX_SPEED, gameSpeed + ACCELERATION);
                } else {
                    gameSpeed = Math.max(MIN_SPEED, gameSpeed - DECELERATION);
                }
                
                // Update player speed display
                playerSpeed = gameSpeed * 100;
                
                // Fire bullets
                if ((keys.Space || touchFire) && fireCooldown <= 0) {
                    fireBullet();
                }
                
                // Move road segments
                roadSegments.forEach(seg => {
                    seg.position.z += gameSpeed;
                    if (seg.position.z > 50) {
                        seg.position.z -= NUM_SEGMENTS * SEGMENT_LENGTH;
                    }
                });
                
                // Move obstacles
                for (let i = obstacles.length - 1; i >= 0; i--) {
                    const obs = obstacles[i];
                    obs.z += gameSpeed;
                    obs.mesh.position.z = obs.z;
                    
                    if (obs.z > 20) {
                        scene.remove(obs.mesh);
                        obstacles.splice(i, 1);
                    }
                }
                
                // Move coins
                for (let i = coins.length - 1; i >= 0; i--) {
                    const coin = coins[i];
                    coin.z += gameSpeed;
                    coin.mesh.position.z = coin.z;
                    // Rotate coin
                    coin.mesh.rotation.y += 0.05;
                    
                    if (coin.z > 20) {
                        scene.remove(coin.mesh);
                        coins.splice(i, 1);
                    }
                }
                
                // Move shields
                for (let i = shields.length - 1; i >= 0; i--) {
                    const shield = shields[i];
                    shield.z += gameSpeed;
                    shield.mesh.position.z = shield.z;
                    shield.mesh.rotation.y += 0.03;
                    
                    if (shield.z > 20) {
                        scene.remove(shield.mesh);
                        shields.splice(i, 1);
                    }
                }
                
                // Move bullets
                for (let i = bullets.length - 1; i >= 0; i--) {
                    const bullet = bullets[i];
                    bullet.z -= bullet.speed;
                    bullet.mesh.position.z = bullet.z;
                    
                    if (bullet.z < -100) {
                        scene.remove(bullet.mesh);
                        bullets.splice(i, 1);
                    }
                }
                
                // Update explosions
                if (window.explosions) {
                    for (let i = window.explosions.length - 1; i >= 0; i--) {
                        const exp = window.explosions[i];
                        exp.userData.life--;
                        exp.children.forEach(p => {
                            p.position.add(p.userData.velocity);
                            p.userData.velocity.y -= 0.01;
                            p.scale.multiplyScalar(0.95);
                        });
                        if (exp.userData.life <= 0) {
                            scene.remove(exp);
                            window.explosions.splice(i, 1);
                        }
                    }
                }
                
                // Spawn logic
                spawnTimer++;
                if (spawnTimer > 40) {
                    spawnTimer = 0;
                    if (obstacles.length < 8) {
                        spawnObstacle();
                    }
                }
                
                coinSpawnTimer++;
                if (coinSpawnTimer > 60) {
                    coinSpawnTimer = 0;
                    if (coins.length < 6) {
                        spawnCoin();
                    }
                }
                
                shieldSpawnTimer++;
                if (shieldSpawnTimer > 300) {
                    shieldSpawnTimer = 0;
                    if (shields.length < 2) {
                        spawnShield();
                    }
                }
                
                // Check collisions
                checkCollisions();
                
                // Increase score over time
                score += Math.floor(gameSpeed * 0.5);
                updateHUD();
            }
            
            // ----- ANIMATION LOOP -----
            function animate() {
                requestAnimationFrame(animate);
                
                if (gameActive && !paused) {
                    updateGame();
                    
                    // Camera follows player smoothly
                    camera.position.x += (playerCar.position.x * 0.3 - camera.position.x) * 0.05;
                    camera.position.y = 5 + gameSpeed * 0.5;
                    camera.lookAt(playerCar.position.x * 0.5, 2, -30);
                    
                    // Tilt car when steering
                    const steerLeft = keys.ArrowLeft || keys.KeyA || touchLeft;
                    const steerRight = keys.ArrowRight || keys.KeyD || touchRight;
                    if (steerLeft) playerCar.rotation.z = 0.1;
                    else if (steerRight) playerCar.rotation.z = -0.1;
                    else playerCar.rotation.z = 0;
                }
                
                renderer.render(scene, camera);
            }
            
            // ----- EVENT LISTENERS -----
            function setupEventListeners() {
                window.addEventListener('keydown', (e) => {
                    if (keys.hasOwnProperty(e.code)) {
                        keys[e.code] = true;
                        e.preventDefault();
                    }
                    
                    if (e.code === 'Escape') {
                        if (gameActive && !gameOver) {
                            paused = !paused;
                            pauseOverlay.style.display = paused ? 'block' : 'none';
                        }
                    }
                });
                
                window.addEventListener('keyup', (e) => {
                    if (keys.hasOwnProperty(e.code)) {
                        keys[e.code] = false;
                        e.preventDefault();
                    }
                });
                
                window.addEventListener('resize', () => {
                    camera.aspect = window.innerWidth / window.innerHeight;
                    camera.updateProjectionMatrix();
                    renderer.setSize(window.innerWidth, window.innerHeight);
                });
                
                // Touch controls
                function addTouchListeners(btn, setter) {
                    btn.addEventListener('touchstart', (e) => {
                        e.preventDefault();
                        setter(true);
                    });
                    btn.addEventListener('touchend', (e) => {
                        e.preventDefault();
                        setter(false);
                    });
                    btn.addEventListener('touchcancel', (e) => {
                        e.preventDefault();
                        setter(false);
                    });
                    // Mouse fallback for testing
                    btn.addEventListener('mousedown', (e) => {
                        e.preventDefault();
                        setter(true);
                    });
                    btn.addEventListener('mouseup', (e) => {
                        e.preventDefault();
                        setter(false);
                    });
                    btn.addEventListener('mouseleave', (e) => {
                        e.preventDefault();
                        setter(false);
                    });
                }
                
                addTouchListeners(btnLeft, (val) => { touchLeft = val; });
                addTouchListeners(btnRight, (val) => { touchRight = val; });
                addTouchListeners(btnAccel, (val) => { touchAccel = val; });
                addTouchListeners(btnFire, (val) => { touchFire = val; });
                
                // Restart button
                restartBtn.addEventListener('click', () => {
                    resetGame();
                });
                
                // Prevent context menu
                window.addEventListener('contextmenu', (e) => e.preventDefault());
            }
            
            // ----- INIT -----
            function init() {
                initThree();
                setupEventListeners();
                animate();
            }
            
            // Wait for DOM
            window.addEventListener('load', init);
        })();
    </script>
</body>
</html>
